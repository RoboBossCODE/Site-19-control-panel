<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Command</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="top"><div><div class="brand">SECURITY COMMAND</div><div class="sub">SITE-19 // LOCAL DEVICE SYSTEM</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div><div class="panel"><h2>SITE SECTORS</h2><div id="sectors" class="sectorGrid"></div></div><div class="panel"><h2>RAPID COMMANDS</h2><div class="row"><button class="btn red" data-all="LOCKDOWN">LOCK ALL</button><button class="btn amber" data-all="ALERT">SITE ALERT</button><button class="btn" data-all="SECURE">RESET SECURE</button></div><div id="msg" class="status" style="margin-top:8px">COMMAND BUS READY</div></div><script>function draw(){const s=S19.get();sectors.innerHTML="";Object.entries(s.sectors||{}).forEach(([k,v])=>{const d=document.createElement("div");d.className="sector "+(v==="SECURE"?"ok":v==="ALERT"?"warn":"bad");d.innerHTML=`<b>SECTOR ${k}</b><br>${v}<div class="row" style="margin-top:8px"><button class="btn" data-s="${k}" data-v="SECURE">SECURE</button><button class="btn amber" data-s="${k}" data-v="ALERT">ALERT</button><button class="btn red" data-s="${k}" data-v="LOCKDOWN">LOCK</button></div>`;sectors.appendChild(d)});document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>setSector(b.dataset.s,b.dataset.v))}function setSector(k,v){const s=S19.get();s.sectors[k]=v;S19.save(s);S19.alert(`Sector ${k} set to ${v}`,"SECURITY");msg.textContent=`SECTOR ${k} // ${v}`;draw()}document.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{const v=b.dataset.all,s=S19.get();Object.keys(s.sectors).forEach(k=>s.sectors[k]=v);S19.save(s);S19.alert(`All sectors set to ${v}`,"SECURITY");draw()});draw()</script></div><script src="site19.js"></script><script>if(S19.require(4)){bindStatus();}</script></body></html>
