<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Site-19 Personnel Scanner</title>
<style>:root{--bg:#050807;--line:#2d6b4b;--text:#d7e4db;--muted:#81958a;--accent:#7df9a8;--gold:#ffdc64;--red:#ff7070}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050807;color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{background:linear-gradient(rgba(125,249,168,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(125,249,168,.02) 1px,transparent 1px),#050807;background-size:24px 24px}.shell{max-width:900px;margin:auto;padding:18px}.topbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.brand{font-size:clamp(20px,5vw,32px);font-weight:900;letter-spacing:.1em;color:var(--accent)}.sub,.small{color:var(--muted);font-size:12px}a{color:inherit;text-decoration:none}.badge,.btn{border:1px solid var(--line);background:#09110d;padding:9px 11px;color:#e7fff0;font:inherit;border-radius:4px}.btn.gold{border-color:#8a762f;color:#ffe69a}.section{border:1px solid #1d3d2e;background:#08100d;margin-top:14px;padding:14px}.section h2{margin:0 0 10px;color:#b9ffd0;font-size:14px}.camera{position:relative;width:100%;aspect-ratio:3/4;max-height:70vh;background:#000;border:1px solid #234b38;overflow:hidden}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}canvas{pointer-events:none}.reticle{position:absolute;left:12%;right:12%;top:28%;bottom:28%;border:2px solid rgba(125,249,168,.8);box-shadow:0 0 20px rgba(125,249,168,.2);pointer-events:none}.status{padding:9px 10px;border-left:3px solid var(--line);background:#07110c;font-size:12px;margin-top:10px}.result{background:#030604;border:1px solid #183527;padding:12px;white-space:pre-wrap;font-size:12px;min-height:130px}.input{width:100%;padding:10px;background:#050a07;border:1px solid #28503d;color:#e9fff0;font:inherit}.row{display:flex;gap:8px;flex-wrap:wrap}.auth{color:var(--gold)}.error{color:var(--red)}dialog{max-width:650px;width:92%;background:#07100c;color:#dcebe1;border:1px solid #2d6b4b;padding:18px}dialog::backdrop{background:rgba(0,0,0,.8)}</style></head><body><div class="shell"><div class="topbar"><div><div class="brand">PERSONNEL ID SCANNER</div><div class="sub">SITE-19 OPTICAL CREDENTIAL READER // BACKEND VERIFIED CREDENTIALS</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div><div class="camera"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><div class="reticle"></div></div><div class="section"><div class="row"><button class="btn" id="start">START SCANNER</button><button class="btn" id="flip">FLIP CAMERA</button></div><div class="status" id="status">SCANNER OFFLINE</div><p class="small">Backend credentials are verified automatically. O5 authority is never trusted from QR text alone.</p></div><div class="section"><h2>IDENTITY RESULT</h2><div class="result" id="result">NO CREDENTIAL PRESENT</div></div><div class="section"><h2>MANUAL DIAGNOSTIC INPUT</h2><input id="manual" class="input" placeholder="S19TOKEN|... or SITE19|Name|Division|LEVEL 4|ID"><button id="parse" class="btn" style="margin-top:8px">PROCESS CREDENTIAL</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const SITE19_KEY="site19_state_v1";
const BACKEND_URL='https://script.google.com/macros/s/AKfycby8D8HsOIAMlaQm6sIq-JEeUefZyvdleREYJN8jKeFBkfdOmreUhvoC__kZGPgm2UCpHw/exec';
const video=document.getElementById("video"),overlay=document.getElementById("overlay"),ctx=overlay.getContext("2d",{willReadFrequently:true}),statusEl=document.getElementById("status"),resultEl=document.getElementById("result"),startBtn=document.getElementById("start"),flipBtn=document.getElementById("flip"),parseBtn=document.getElementById("parse"),manualInput=document.getElementById("manual");
let stream=null,running=false,facing="environment",lastRaw="",lastScan=0,processing=false;
function loadState(){try{return Object.assign({clearance:0,emergency:"NORMAL",alerts:[],personnel:null},JSON.parse(localStorage.getItem(SITE19_KEY)||"{}"))}catch{return{clearance:0,emergency:"NORMAL",alerts:[],personnel:null}}}
function saveState(s){localStorage.setItem(SITE19_KEY,JSON.stringify(s))}
function clearanceNumberLocal(t){const v=String(t||"").trim().toUpperCase();if(v==="O5"||v==="05"||v.includes("O5"))return 5;const m=v.match(/([1-4])/);return m?Number(m[1]):0}
function clearanceNameLocal(l){l=Number(l)||0;if(l>=5)return"O5";if(l<=0)return"GUEST";return"LEVEL "+l}
function startLocalSession(p){const s=loadState();s.personnel=p;s.clearance=Number(p.clearanceLevel)||0;s.alerts=Array.isArray(s.alerts)?s.alerts:[];s.alerts.unshift({time:new Date().toISOString(),msg:`Personnel authenticated locally: ${p.name||"REDACTED"} // ${clearanceNameLocal(p.clearanceLevel)}`,severity:"SECURITY"});s.alerts=s.alerts.slice(0,60);saveState(s);if(p.clearanceLevel>=5)localStorage.setItem("site19_o5_authorized","1");else localStorage.removeItem("site19_o5_authorized")}
function backendUrl(){return BACKEND_URL}
async function verifyBackendToken(token){const url=backendUrl();if(!url)throw new Error("BACKEND_URL_NOT_SET");const r=await fetch(url,{method:"POST",body:JSON.stringify({action:"verify",token:String(token||"").trim()})});if(!r.ok)throw new Error("BACKEND_HTTP_"+r.status);return await r.json()}
function fail(t,d){processing=false;lastRaw="";resultEl.textContent=t+"\n\n"+d;statusEl.innerHTML='<span class="error">ACCESS DENIED / VERIFICATION FAILED</span>'}
async function processBackendCredential(raw){const token=raw.slice("S19TOKEN|".length).trim();if(!token){fail("INVALID TOKEN CREDENTIAL","NO TOKEN PRESENT");return}statusEl.textContent="CONTACTING SITE-19 CREDENTIAL SERVER...";resultEl.textContent="VERIFYING CREDENTIAL WITH BACKEND...";try{const data=await verifyBackendToken(token);if(!data||data.ok!==true||data.valid!==true){fail("CREDENTIAL REJECTED","SERVER RESPONSE: "+String(data?.error||"INVALID_CREDENTIAL"));return}
localStorage.setItem("site19_backend_session",String(data.sessionToken||""));
localStorage.setItem("site19_backend_session_expires",String(data.expires||0));
const level=clearanceNumberLocal(data.clearance);if(level<=0){fail("CREDENTIAL REJECTED","BACKEND RETURNED INVALID CLEARANCE");return}const old=loadState().personnel,personnel={name:old?.name||"REDACTED PERSONNEL",division:old?.division||(level>=5?"O5 COMMAND":"FOUNDATION PERSONNEL"),clearanceText:data.clearance,clearanceLevel:level,credentialId:"BACKEND-VERIFIED",backendVerified:true};startLocalSession(personnel);running=false;if(stream)stream.getTracks().forEach(t=>t.stop());resultEl.textContent=`BACKEND VERIFIED CREDENTIAL\n\nCLEARANCE: ${clearanceNameLocal(level)}\nAUTHORITY: SERVER VERIFIED\nIDENTITY DATA: DEVICE LOCAL ONLY\n\nSTATUS: AUTHORIZED\nSITE-19 SESSION STARTED`;statusEl.innerHTML='<span class="auth">ACCESS GRANTED // RETURNING TO CONTROL PANEL</span>';if(navigator.vibrate)navigator.vibrate([70,40,70]);setTimeout(()=>location.href="index.html",1000)}catch(err){if(String(err.message)==="BACKEND_URL_NOT_SET"){fail("BACKEND NOT CONFIGURED","OPEN BACKEND SETTINGS AND PASTE YOUR APPS SCRIPT /exec URL.");settingsDialog.showModal()}else fail("BACKEND VERIFICATION ERROR",String(err.message||err))}}
function processLegacyCredential(raw){const p=String(raw).split("|");if(p[0]!=="SITE19"||p.length<4){fail("UNRECOGNIZED QR CREDENTIAL","INVALID FORMAT");return}const name=(p[1]||"").trim(),division=(p[2]||"").trim(),ct=(p[3]||"").trim().toUpperCase(),id=(p[4]||"UNREGISTERED").trim(),level=clearanceNumberLocal(ct);if(!name||!division||level<=0){fail("CREDENTIAL REJECTED","INVALID PERSONNEL DATA");return}if(level>=5){fail("O5 CREDENTIAL REJECTED","O5 REQUIRES A BACKEND-VERIFIED S19TOKEN CREDENTIAL.");return}startLocalSession({name,division,clearanceText:ct,clearanceLevel:level,credentialId:id,backendVerified:false});running=false;if(stream)stream.getTracks().forEach(t=>t.stop());resultEl.textContent=`PERSONNEL IDENTIFIED\n\nNAME: ${name}\nDIVISION: ${division}\nCLEARANCE: ${clearanceNameLocal(level)}\nCREDENTIAL: ${id}\n\nSTATUS: LOCAL AUTHORIZATION\nNOTE: O5 REQUIRES BACKEND VERIFICATION`;statusEl.textContent="ACCESS GRANTED // RETURNING TO CONTROL PANEL";setTimeout(()=>location.href="index.html",900)}
async function processCredential(raw){if(processing)return;raw=String(raw||"").trim();if(!raw)return;processing=true;try{if(raw.startsWith("S19TOKEN|"))await processBackendCredential(raw);else processLegacyCredential(raw)}finally{if(running){processing=false;setTimeout(()=>lastRaw="",900)}}}
async function startScanner(){try{if(typeof jsQR!=="function"){statusEl.textContent="QR DECODER FAILED TO LOAD // CHECK INTERNET";return}if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();running=true;processing=false;lastRaw="";statusEl.textContent="OPTICAL QR SCANNER ONLINE // SEARCHING";requestAnimationFrame(scanLoop)}catch(e){statusEl.textContent="CAMERA ERROR // "+e.message}}
function scanLoop(now){if(!running)return;requestAnimationFrame(scanLoop);if(processing||now-lastScan<100)return;lastScan=now;if(video.readyState<2||!video.videoWidth)return;const maxW=640,scale=Math.min(1,maxW/video.videoWidth);overlay.width=Math.round(video.videoWidth*scale);overlay.height=Math.round(video.videoHeight*scale);ctx.drawImage(video,0,0,overlay.width,overlay.height);const img=ctx.getImageData(0,0,overlay.width,overlay.height),code=jsQR(img.data,img.width,img.height,{inversionAttempts:"attemptBoth"});ctx.clearRect(0,0,overlay.width,overlay.height);if(code){const L=code.location;ctx.strokeStyle="#7df9a8";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(L.topLeftCorner.x,L.topLeftCorner.y);ctx.lineTo(L.topRightCorner.x,L.topRightCorner.y);ctx.lineTo(L.bottomRightCorner.x,L.bottomRightCorner.y);ctx.lineTo(L.bottomLeftCorner.x,L.bottomLeftCorner.y);ctx.closePath();ctx.stroke();if(code.data!==lastRaw){lastRaw=code.data;processCredential(code.data)}}else statusEl.textContent="OPTICAL QR SCANNER ONLINE // SEARCHING"}
startBtn.onclick=startScanner;flipBtn.onclick=async()=>{facing=facing==="environment"?"user":"environment";await startScanner()};parseBtn.onclick=()=>{lastRaw="";processing=false;processCredential(manualInput.value.trim())};
</script></body></html>
