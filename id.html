<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personnel Scanner</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="topbar"><div><div class="brand">PERSONNEL ID SCANNER</div><div class="sub">QR CREDENTIAL READER</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div>
<div class="cameraWrap"><video id="v" autoplay muted playsinline></video></div>
<div class="section"><div class="row"><button class="btn" id="start">START QR SCANNER</button></div><div id="msg" class="statusline">SCANNER OFFLINE</div></div>
<div class="section"><h2>MANUAL CREDENTIAL TEST</h2><input id="manual" class="input" placeholder="SITE19|NAME|DIVISION|LEVEL"><button id="parse" class="btn" style="margin-top:8px">PARSE CREDENTIAL</button></div>
<div class="section"><h2>IDENTITY RESULT</h2><div id="result" class="log">NO CREDENTIAL PRESENT</div></div>
</div><script src="site19.js"></script><script>
const v=document.getElementById("v");let det,run=false;
function show(raw){const p=String(raw).split("|");if(p[0]!=="SITE19"||p.length<4){result.textContent="INVALID / UNKNOWN CREDENTIAL";return}result.textContent=`PERSONNEL IDENTIFIED\n\nNAME: ${p[1]}\nDIVISION: ${p[2]}\nCLEARANCE: ${p[3]}\nSTATUS: AUTHORIZED`;S19.alert("Personnel credential scanned: "+p[1],"ID")}
async function go(){if(!("BarcodeDetector" in window)){msg.textContent="QR API NOT SUPPORTED HERE // USE MANUAL FIELD";return}try{det=new BarcodeDetector({formats:["qr_code"]});const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});v.srcObject=s;await v.play();run=true;msg.textContent="QR SCANNER ONLINE";scan()}catch(e){msg.textContent="SCANNER ERROR: "+e.message}}
async function scan(){if(!run)return;try{const a=await det.detect(v);if(a[0])show(a[0].rawValue)}catch{}setTimeout(scan,250)}
start.onclick=go;parse.onclick=()=>show(manual.value.trim());
</script></body></html>
