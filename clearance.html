<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clearance</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="topbar"><div><div class="brand">CLEARANCE TERMINAL</div><div class="sub">SITE-19 PERSONNEL AUTHORIZATION NODE</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div>
<div class="section"><h2>CURRENT ACCESS</h2><div class="metric" data-clearance>GUEST</div><p class="small">Static HTML version: casual gating only, not secure authentication.</p></div>
<div class="section"><h2>ENTER ACCESS CODE</h2><input id="code" class="input" placeholder="FOUNDATION ACCESS CODE"><div class="row" style="margin-top:10px"><button class="btn" id="auth">AUTHENTICATE</button><button class="btn danger" id="logout">RETURN TO GUEST</button></div><div id="msg" class="statusline" style="margin-top:10px">AWAITING CREDENTIALS</div></div>
</div><script src="site19.js"></script><script>bindGlobalStatus();auth.onclick=()=>{if(S19.unlock(code.value)){msg.textContent="ACCESS GRANTED // "+S19.clearanceName(S19.get().clearance);code.value=""}else{msg.textContent="ACCESS DENIED";S19.alert("Invalid clearance code attempt","SECURITY")}};logout.onclick=()=>{S19.resetClearance();msg.textContent="SESSION RETURNED TO GUEST"}</script></body></html>
