<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Containment Response</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="top"><div><div class="brand">CONTAINMENT RESPONSE</div><div class="sub">SITE-19 // LOCAL DEVICE SYSTEM</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div><div class="panel"><h2>CONTAINMENT RESPONSE</h2><select id="type"><option>CONTAINMENT BREACH</option><option>COGNITOHAZARD EVENT</option><option>HOSTILE INTRUSION</option><option>BIOLOGICAL ALERT</option><option>POWER FAILURE</option></select><select id="sec" style="margin-top:8px"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select><div class="row" style="margin-top:8px"><button id="isolate" class="btn red">ISOLATE SECTOR</button><button id="alert" class="btn amber">RAISE ALERT</button><button id="clear" class="btn">STAND DOWN</button></div><div id="msg" class="status" style="margin-top:8px">RESPONSE SYSTEM READY</div></div><script>isolate.onclick=()=>{const s=S19.get();s.sectors[sec.value]="LOCKDOWN";S19.save(s);S19.alert(`${type.value}: Sector ${sec.value} isolated`,"RESPONSE");msg.textContent=`SECTOR ${sec.value} ISOLATED`};alert.onclick=()=>{const s=S19.get();s.sectors[sec.value]="ALERT";S19.save(s);S19.alert(`${type.value}: Alert raised in Sector ${sec.value}`,"RESPONSE");msg.textContent=`ALERT ACTIVE // SECTOR ${sec.value}`};clear.onclick=()=>{const s=S19.get();s.sectors[sec.value]="SECURE";S19.save(s);S19.alert(`Response stood down in Sector ${sec.value}`,"RESPONSE");msg.textContent=`SECTOR ${sec.value} SECURE`}</script></div><script src="site19.js"></script><script>if(S19.require(4)){bindStatus();}</script></body></html>
