<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Diagnostics</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="top"><div><div class="brand">SYSTEM DIAGNOSTICS</div><div class="sub">SITE-19 // LOCAL DEVICE SYSTEM</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div><div class="panel"><h2>SYSTEM DIAGNOSTICS</h2><div id="diag" class="log"></div><button id="run" class="btn" style="margin-top:8px">RUN DIAGNOSTICS</button></div><script>function go(){const s=S19.get();diag.textContent=`USER AGENT:\n${navigator.userAgent}\n\nCAMERA API: ${!!navigator.mediaDevices?.getUserMedia}\nLOCAL STORAGE: ${typeof localStorage!=="undefined"}\nWEB AUDIO: ${!!(window.AudioContext||window.webkitAudioContext)}\n\nCURRENT PERSONNEL: ${s.personnel?.name||"NONE"}\nREAL CLEARANCE: ${S19.clearanceName(s.clearance)}\nSIMULATED CLEARANCE: ${s.simulatedClearance===null||s.simulatedClearance===undefined?"OFF":S19.clearanceName(s.simulatedClearance)}\nEMERGENCY: ${s.emergency}\nALERT COUNT: ${(s.alerts||[]).length}`};run.onclick=go;go()</script></div><script src="site19.js"></script><script>if(S19.require(5)){bindStatus();}</script></body></html>
