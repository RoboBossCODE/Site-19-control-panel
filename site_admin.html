<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Site Administration</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="top"><div><div class="brand">SITE ADMINISTRATION</div><div class="sub">SITE-19 // LOCAL DEVICE SYSTEM</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div><div class="panel"><h2>O5 SITE ADMINISTRATION</h2><div class="row"><button id="resetEmergency" class="btn">RESET EMERGENCY STATE</button><button id="resetSectors" class="btn">RESET ALL SECTORS</button><button id="clearLogs" class="btn red">CLEAR ALL LOCAL LOGS</button></div><div id="msg" class="status" style="margin-top:8px">ADMIN SYSTEM READY</div></div><script>resetEmergency.onclick=()=>{S19.set("emergency","NORMAL");msg.textContent="EMERGENCY STATE RESET"};resetSectors.onclick=()=>{const s=S19.get();Object.keys(s.sectors).forEach(k=>s.sectors[k]="SECURE");S19.save(s);msg.textContent="ALL SECTORS SECURE"};clearLogs.onclick=()=>{const s=S19.get();s.alerts=[];s.securityLog=[];s.incidents=[];s.mtf=[];S19.save(s);msg.textContent="LOCAL LOGS CLEARED"}</script></div><script src="site19.js"></script><script>if(S19.require(5)){bindStatus();}</script></body></html>
