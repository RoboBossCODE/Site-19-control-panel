<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTF Dispatch</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="top"><div><div class="brand">MTF DISPATCH</div><div class="sub">SITE-19 // LOCAL DEVICE SYSTEM</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div><div class="panel"><h2>DEPLOY UNIT</h2><select id="unit"><option>MTF Epsilon-11 "Nine-Tailed Fox"</option><option>MTF Nu-7 "Hammer Down"</option><option>MTF Beta-7 "Maz Hatters"</option><option>MTF Eta-10 "See No Evil"</option></select><select id="sec" style="margin-top:8px"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select><select id="statusSel" style="margin-top:8px"><option>STANDBY</option><option>DEPLOYED</option><option>ENGAGED</option><option>RETURNING</option></select><button id="deploy" class="btn" style="margin-top:8px">ASSIGN UNIT</button></div><div class="panel"><h2>DEPLOYMENT BOARD</h2><div id="board" class="log"></div></div><script>function draw(){board.textContent=(S19.get().mtf||[]).map(x=>`${x.unit}\nSECTOR ${x.sector} // ${x.status}`).join("\n\n")||"No units assigned."}deploy.onclick=()=>{const s=S19.get();s.mtf=Array.isArray(s.mtf)?s.mtf:[];s.mtf.unshift({unit:unit.value,sector:sec.value,status:statusSel.value,time:new Date().toISOString()});S19.save(s);S19.alert(`${unit.value} assigned to Sector ${sec.value}`,"MTF");draw()};draw()</script></div><script src="site19.js"></script><script>if(S19.require(4)){bindStatus();}</script></body></html>
