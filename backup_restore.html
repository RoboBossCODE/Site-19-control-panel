<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backup / Restore</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="top"><div><div class="brand">BACKUP / RESTORE</div><div class="sub">SITE-19 // LOCAL DEVICE SYSTEM</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div><div class="panel"><h2>BACKUP</h2><button id="exportBtn" class="btn">DOWNLOAD LOCAL STATE JSON</button></div><div class="panel"><h2>RESTORE</h2><input id="file" class="input" type="file" accept=".json,application/json"><button id="restore" class="btn amber" style="margin-top:8px">RESTORE THIS DEVICE</button><div id="msg" class="status" style="margin-top:8px">NO ACTION</div></div><script>exportBtn.onclick=()=>{const blob=new Blob([JSON.stringify(S19.get(),null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="site19_local_backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};restore.onclick=()=>{const f=file.files&&file.files[0];if(!f){msg.textContent="SELECT A JSON FILE";return}const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);S19.save(Object.assign({},S19.defaults,obj));msg.textContent="RESTORE COMPLETE"}catch(e){msg.textContent="INVALID BACKUP"}};r.readAsText(f)}</script></div><script src="site19.js"></script><script>if(S19.require(5)){bindStatus();}</script></body></html>
