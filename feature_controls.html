<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feature Controls</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="top"><div><div class="brand">FEATURE CONTROLS</div><div class="sub">SITE-19 // LOCAL DEVICE SYSTEM</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div><div class="panel"><h2>FEATURE CONTROLS</h2><div id="controls"></div></div><script>const defs=[["enhancedHUD","Enhanced HUD"],["verboseAlerts","Verbose Alerts"],["experimentalUI","Experimental UI"],["debugLabels","Debug Labels"]];function draw(){const s=S19.get();s.features=s.features||{};controls.innerHTML="";defs.forEach(([k,l])=>{const d=document.createElement("div");d.className="row";d.style.marginBottom="8px";d.innerHTML=`<button class="btn" data-k="${k}">${s.features[k]?"ON":"OFF"}</button><span>${l}</span>`;controls.appendChild(d)});document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const s=S19.get();s.features=s.features||{};s.features[b.dataset.k]=!s.features[b.dataset.k];S19.save(s);draw()})}draw()</script></div><script src="site19.js"></script><script>if(S19.require(5)){bindStatus();}</script></body></html>
