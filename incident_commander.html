<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incident Commander</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="top"><div><div class="brand">INCIDENT COMMANDER</div><div class="sub">SITE-19 // LOCAL DEVICE SYSTEM</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div><div class="panel"><h2>CREATE INCIDENT</h2><input id="title" class="input" placeholder="INCIDENT TITLE"><select id="sev" style="margin-top:8px"><option>LOW</option><option>MODERATE</option><option>HIGH</option><option>CRITICAL</option></select><select id="sec" style="margin-top:8px"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select><textarea id="desc" placeholder="Incident details..."></textarea><button class="btn red" id="create">OPEN INCIDENT</button></div><div class="panel"><h2>ACTIVE / RECENT</h2><div id="inc" class="log"></div></div><script>function draw(){const s=S19.get();inc.textContent=(s.incidents||[]).map(x=>`[${x.severity}] ${x.title} // SECTOR ${x.sector} // ${x.status}\n${x.desc}\n`).join("\n")||"No incidents."}create.onclick=()=>{const s=S19.get();s.incidents=Array.isArray(s.incidents)?s.incidents:[];s.incidents.unshift({title:title.value||"UNTITLED",severity:sev.value,sector:sec.value,desc:desc.value,status:"ACTIVE",time:new Date().toISOString()});s.sectors[sec.value]="ALERT";S19.save(s);S19.alert(`Incident opened: ${title.value||"UNTITLED"} // Sector ${sec.value}`,"INCIDENT");draw()};draw()</script></div><script src="site19.js"></script><script>if(S19.require(4)){bindStatus();}</script></body></html>
