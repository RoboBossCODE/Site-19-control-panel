<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emergency Control</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="topbar"><div><div class="brand">EMERGENCY CONTROL</div><div class="sub">SITE-19 INCIDENT STATE BUS</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div>
<div class="section"><h2>CURRENT SITE STATE</h2><div id="state" class="metric">NORMAL</div></div>
<div class="section"><h2>COMMANDS</h2><div class="row"><button class="btn danger" data-state="LOCKDOWN">SITE LOCKDOWN</button><button class="btn danger" data-state="CONTAINMENT BREACH">CONTAINMENT BREACH</button><button class="btn warn" data-state="EVACUATION">EVACUATION</button><button class="btn" data-state="NORMAL">ALL CLEAR</button></div><div id="msg" class="statusline" style="margin-top:10px">COMMAND BUS READY</div></div>
</div><script src="site19.js"></script><script>function paint(){state.textContent=S19.get().emergency}paint();window.addEventListener("site19state",paint);document.querySelectorAll("[data-state]").forEach(b=>b.onclick=()=>{const v=b.dataset.state;S19.set("emergency",v);S19.alert("Emergency state changed to "+v,"EMERGENCY");msg.textContent="COMMAND ACCEPTED // "+v})</script></body></html>
