<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Data Inspector</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="top"><div><div class="brand">LOCAL DATA INSPECTOR</div><div class="sub">SITE-19 // LOCAL DEVICE SYSTEM</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div><div class="panel"><h2>LOCAL STORAGE INSPECTOR</h2><div id="summary" class="log"></div><div class="row" style="margin-top:8px"><button id="wipeAlerts" class="btn">WIPE ALERTS</button><button id="wipeOps" class="btn">WIPE OPERATIONS DATA</button><button id="wipeAll" class="btn red">WIPE ALL SITE-19 LOCAL DATA</button></div></div><script>function draw(){const s=S19.get();summary.textContent=JSON.stringify({personnel:s.personnel,clearance:s.clearance,emergency:s.emergency,alerts:(s.alerts||[]).length,incidents:(s.incidents||[]).length,mtf:(s.mtf||[]).length,sectors:s.sectors,features:s.features},null,2)}wipeAlerts.onclick=()=>{const s=S19.get();s.alerts=[];s.securityLog=[];S19.save(s);draw()};wipeOps.onclick=()=>{const s=S19.get();s.incidents=[];s.mtf=[];Object.keys(s.sectors).forEach(k=>s.sectors[k]="SECURE");S19.save(s);draw()};wipeAll.onclick=()=>{localStorage.removeItem(S19.key);localStorage.removeItem("site19_o5_authorized");localStorage.removeItem("site19_o5_personnel");location.href="index.html"};draw()</script></div><script src="site19.js"></script><script>if(S19.require(5)){bindStatus();}</script></body></html>
