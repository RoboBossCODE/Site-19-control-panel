<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkpoint Mode</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="top"><div><div class="brand">CHECKPOINT MODE</div><div class="sub">SITE-19 // LOCAL DEVICE SYSTEM</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div><div class="panel"><h2>CHECKPOINT</h2><select id="area"><option data-l="1">General Offices</option><option data-l="2">Research Wing</option><option data-l="3">High Security Labs</option><option data-l="4">Command Sector</option><option data-l="5">O5 Command</option></select><input class="input" id="cred" placeholder="SITE19|Name|Division|LEVEL 4|ID" style="margin-top:8px"><button class="btn" id="test" style="margin-top:8px">VERIFY ACCESS</button><div id="res" class="status" style="margin-top:8px">AWAITING CREDENTIAL</div></div><script>test.onclick=()=>{const p=cred.value.split("|"),req=Number(area.selectedOptions[0].dataset.l),lev=S19.clearanceNumber(p[3]);if(p[0]!=="SITE19"||!p[1]){res.textContent="INVALID CREDENTIAL";return}const ok=lev>=req;res.textContent=(ok?"ACCESS GRANTED":"ACCESS DENIED")+` // ${p[1]} // ${S19.clearanceName(lev)} // REQUIRED ${S19.clearanceName(req)}`;S19.alert(`Checkpoint ${ok?"granted":"denied"}: ${p[1]} → ${area.value}`,"ACCESS")}</script></div><script src="site19.js"></script><script>if(S19.require(4)){bindStatus();}</script></body></html>
