<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tactical Site Map</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="top"><div><div class="brand">TACTICAL SITE MAP</div><div class="sub">SITE-19 // LOCAL DEVICE SYSTEM</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div><div class="panel"><h2>TACTICAL SECTOR MAP</h2><div id="map" class="sectorGrid"></div></div><div class="panel"><h2>ACTIVE MTF</h2><div id="mtfs" class="log"></div></div><script>function draw(){const s=S19.get();map.innerHTML="";Object.entries(s.sectors||{}).forEach(([k,v])=>{const d=document.createElement("div");d.className="sector "+(v==="SECURE"?"ok":v==="ALERT"?"warn":"bad");d.innerHTML=`<b>SECTOR ${k}</b><br>${v}<br><span class="small">${(s.mtf||[]).filter(x=>x.sector===k).map(x=>x.unit).join("<br>")||"No unit"}</span>`;map.appendChild(d)});mtfs.textContent=(s.mtf||[]).map(x=>`${x.unit} // SECTOR ${x.sector} // ${x.status}`).join("\n")||"No active deployments."}draw();addEventListener("site19state",draw)</script></div><script src="site19.js"></script><script>if(S19.require(4)){bindStatus();}</script></body></html>
