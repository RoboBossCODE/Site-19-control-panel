<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clearance Simulator</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="top"><div><div class="brand">CLEARANCE SIMULATOR</div><div class="sub">SITE-19 // LOCAL DEVICE SYSTEM</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div><div class="panel"><h2>CLEARANCE SIMULATOR</h2><p class="small">Real O5 session remains active. This only changes what the dashboard shows.</p><div class="row"><button class="btn" data-l="0">GUEST</button><button class="btn" data-l="1">LEVEL 1</button><button class="btn" data-l="2">LEVEL 2</button><button class="btn" data-l="3">LEVEL 3</button><button class="btn amber" data-l="4">LEVEL 4</button><button class="btn gold" data-l="">END SIMULATION</button></div><div id="msg" class="status" style="margin-top:8px"></div></div><script>function paint(){const s=S19.get();msg.textContent=s.simulatedClearance===null||s.simulatedClearance===undefined?"SIMULATION OFF // REAL SESSION O5":`SIMULATED DASHBOARD: ${S19.clearanceName(s.simulatedClearance)} // REAL SESSION REMAINS O5`}document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const s=S19.get();s.simulatedClearance=b.dataset.l===""?null:Number(b.dataset.l);S19.save(s);paint()});paint()</script></div><script src="site19.js"></script><script>if(S19.require(5)){bindStatus();}</script></body></html>
