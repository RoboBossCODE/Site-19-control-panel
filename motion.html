<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Detection</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="topbar"><div><div class="brand">MOTION DETECTION</div><div class="sub">FRAME DIFFERENCE ACTIVITY SENSOR</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div>
<div class="cameraWrap"><video id="v" autoplay muted playsinline></video></div>
<div class="section"><div class="row"><button class="btn" id="start">START SENSOR</button><label class="small">SENSITIVITY <input id="sens" type="range" min="10" max="70" value="30"></label></div><div class="metric"><span id="pct">0</span>%</div><div id="msg" class="statusline">SENSOR OFFLINE</div></div>
</div><script src="site19.js"></script><script>
const v=document.getElementById("v");let prev=null,lastAlert=0,run=false;const w=160,h=90,tmp=document.createElement("canvas"),t=tmp.getContext("2d",{willReadFrequently:true});tmp.width=w;tmp.height=h;
async function go(){try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:640}},audio:false});v.srcObject=s;await v.play();run=true;msg.textContent="MOTION SENSOR ONLINE";requestAnimationFrame(loop)}catch(e){msg.textContent="CAMERA ERROR: "+e.message}}
function loop(now){if(!run)return;t.drawImage(v,0,0,w,h);const d=t.getImageData(0,0,w,h).data;let changed=0;if(prev){const th=Number(sens.value);for(let i=0;i<d.length;i+=16){const q=Math.abs(d[i]-prev[i])+Math.abs(d[i+1]-prev[i+1])+Math.abs(d[i+2]-prev[i+2]);if(q>th*3)changed++}const total=d.length/16,p=changed/total*100;pct.textContent=p.toFixed(1);if(p>6&&now-lastAlert>2500){lastAlert=now;S19.alert("Motion detected: "+p.toFixed(1)+"% activity","MOTION");msg.textContent="MOVEMENT DETECTED // "+p.toFixed(1)+"%"}else if(p<=6)msg.textContent="MONITORING // NO SIGNIFICANT MOVEMENT"}prev=new Uint8ClampedArray(d);requestAnimationFrame(loop)}
start.onclick=go;
</script></body></html>
