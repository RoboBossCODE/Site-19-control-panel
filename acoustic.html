<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acoustic Monitor</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="topbar"><div><div class="brand">ACOUSTIC MONITOR</div><div class="sub">LIVE AUDIO ANOMALY ANALYSIS</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div>
<div class="section"><canvas id="wave" width="900" height="260"></canvas><div class="metric"><span id="level">0</span>%</div><div class="row"><button class="btn" id="start">START MICROPHONE</button><label class="small">ALERT THRESHOLD <input id="th" type="range" min="20" max="95" value="65"></label></div><div id="msg" class="statusline">MICROPHONE OFFLINE</div></div><div class="section"><h2>LOCAL AUDIO EVENTS</h2><div id="log" class="log">No events.</div></div>
</div><script src="site19.js"></script><script>
const c=wave,x=c.getContext("2d");let ac,an,data,last=0,events=[];
async function go(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});ac=new (window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(s).connect(an);data=new Uint8Array(an.fftSize);msg.textContent="ACOUSTIC SENSOR ONLINE";requestAnimationFrame(loop)}catch(e){msg.textContent="MIC ERROR: "+e.message}}
function loop(now){an.getByteTimeDomainData(data);let sum=0;x.clearRect(0,0,c.width,c.height);x.beginPath();for(let i=0;i<data.length;i++){const n=(data[i]-128)/128;sum+=n*n;const px=i/(data.length-1)*c.width,py=c.height/2+n*c.height*.42;i?x.lineTo(px,py):x.moveTo(px,py)}x.strokeStyle="#7df9a8";x.stroke();const rms=Math.sqrt(sum/data.length),p=Math.min(100,rms*280);level.textContent=p.toFixed(0);if(p>Number(th.value)&&now-last>1800){last=now;const e=new Date().toLocaleTimeString()+"  IMPULSE DETECTED // "+p.toFixed(0)+"%";events.unshift(e);events=events.slice(0,30);log.textContent=events.join("\n");S19.alert("Acoustic impulse: "+p.toFixed(0)+"%","AUDIO");msg.textContent="ACOUSTIC ANOMALY DETECTED"}requestAnimationFrame(loop)}
start.onclick=go;
</script></body></html>
