<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optical System</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><div class="topbar"><div><div class="brand">OPTICAL SYSTEM</div><div class="sub">MOBILE VISUAL ENHANCEMENT UNIT</div></div><a class="badge" href="index.html">← CONTROL PANEL</a></div>
<div class="cameraWrap"><video id="v" autoplay muted playsinline></video><canvas id="c" class="hidden"></canvas></div>
<div class="section"><div class="row"><button class="btn" id="start">START CAMERA</button><button class="btn" data-mode="normal">NORMAL</button><button class="btn" data-mode="night">NIGHT VISION</button><button class="btn" data-mode="contrast">HIGH CONTRAST</button><button class="btn" data-mode="thermal">FALSE COLOR</button><button class="btn" id="freeze">FREEZE FRAME</button><button class="btn" id="shot">SAVE SNAPSHOT</button></div><label class="small">OPTICAL ZOOM <input id="zoom" type="range" min="1" max="3" value="1" step=".05"></label><div id="msg" class="statusline" style="margin-top:10px">CAMERA OFFLINE</div></div>
</div><script>
let stream=null,frozen=false,mode="normal";const v=document.getElementById("v"),c=document.getElementById("c"),ctx=c.getContext("2d");
async function go(){try{stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});v.srcObject=stream;await v.play();msg.textContent="OPTICAL FEED ONLINE"}catch(e){msg.textContent="CAMERA ERROR: "+e.message}}
function apply(){const m={normal:"none",night:"grayscale(1) sepia(1) hue-rotate(65deg) saturate(7) brightness(1.2) contrast(1.3)",contrast:"grayscale(1) contrast(2.4) brightness(1.05)",thermal:"grayscale(.2) sepia(1) hue-rotate(155deg) saturate(5) contrast(1.4)"};v.style.filter=m[mode]}
start.onclick=go;document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;apply();msg.textContent="MODE // "+mode.toUpperCase()});zoom.oninput=()=>v.style.transform=`scale(${zoom.value})`;
freeze.onclick=()=>{if(!v.videoWidth)return;c.width=v.videoWidth;c.height=v.videoHeight;ctx.filter=getComputedStyle(v).filter;ctx.drawImage(v,0,0);c.classList.toggle("hidden");frozen=!frozen;freeze.textContent=frozen?"RESUME FEED":"FREEZE FRAME"};
shot.onclick=()=>{if(!v.videoWidth)return;const t=document.createElement("canvas"),x=t.getContext("2d");t.width=v.videoWidth;t.height=v.videoHeight;x.filter=getComputedStyle(v).filter;x.drawImage(v,0,0);const a=document.createElement("a");a.download="site19_optical_"+Date.now()+".png";a.href=t.toDataURL("image/png");a.click()};
</script></body></html>
